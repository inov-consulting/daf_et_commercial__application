sonar.projectKey=${env.SONAR_PROJECT_KEY}
sonar.projectName=DAF Augmente
sonar.organization=${env.SONAR_ORGANIZATION}

# Sources
sonar.sources=backend/app,front_web/src
sonar.tests=backend/tests,front_web/src/__tests__

# Exclusions
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/node_modules/**,**/.next/**,**/migrations/**

# Python
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml

# TypeScript / JavaScript
sonar.javascript.lcov.reportPaths=front_web/coverage/lcov.info
sonar.typescript.tsconfigPath=front_web/tsconfig.json

# Encoding
sonar.sourceEncoding=UTF-8
