[project]
name = "PortaLis"
version = "0.1.0"
description = "Backend FastAPI — Plateforme IA Commerciale & DAF (Hawa Paraiso / INOV Consulting)"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # ── Web framework ──
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    # ── DB ──
    "asyncpg>=0.30",
    "tortoise-orm[asyncpg]>=0.21",
    "aerich>=0.7",
    # ── HTTP client (Odoo, IA) ──
    "httpx>=0.27",
    "tenacity>=9.0",
    # ── Async tasks ──
    "celery[redis]>=5.4",
    "redis>=5.2",
    # ── Storage / files ──
    "boto3>=1.35",
    "python-multipart>=0.0.20",
    # ── Observability ──
    "structlog>=24.4",
    "sentry-sdk[fastapi]>=2.18",
    # ── AI providers ──
    "anthropic>=0.39",
    "openai>=1.55",
    # ── LangChain Agent + MCP ──
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.3",
    "langchain-mcp-adapters>=0.1",
    "mcp>=1.0",
    "langgraph>=0.2",
    # ── Auth ──
    "python-keycloak>=7.1",
    "pyjwt>=2.10",
    # ── Misc ──
    "python-dateutil>=2.9",
    "babel>=2.16",
    "pyyaml>=6.0",
    "langchain-groq>=1.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "ruff>=0.8",
    "mypy>=1.13",
    "factory-boy>=3.3",
    "httpx>=0.27",  # pour TestClient async
]

[tool.uv]
package = false  # ce n'est pas une lib, juste une app

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "N",             # naming
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
]
ignore = ["E501"]  # géré par formatter

[tool.ruff.format]
quote-style = "double"

[tool.aerich]
tortoise_orm = "app.infrastructure.db.config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=app --cov-report=term-missing"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
