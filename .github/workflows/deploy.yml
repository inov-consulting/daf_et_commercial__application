name: Deploy Staging

on:
  workflow_run:
    workflows: ["CI - SonarQube, Tests & Build"]
    branches: [staging]
    types: [completed]

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Déploiement Staging  Build + Run directement sur le serveur SSH
  # Pas de registry : le serveur clone, build et déploie localement
  # ═══════════════════════════════════════════════════════════════════════
  deploy-staging:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@8f7ff77302c4609bbe2c97748b52241025f17a61 # v1.1.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_KEY }}
          script: |
            set -e
            PROJECT_DIR="/opt/daf-augmente"

            # 1. Mise à jour du code
            cd "$PROJECT_DIR"
            git fetch origin
            git checkout staging
            git pull origin staging

            # 2. Build des images directement sur le serveur
            docker compose -f docker-compose.staging.yml build

            # 3. Redémarrage des services
            docker compose -f docker-compose.staging.yml up -d --remove-orphans

            # 4. Migrations
            docker compose -f docker-compose.staging.yml exec -T backend uv run aerich upgrade || true
