name: CI - SonarQube, Tests & Build

on:
  push:
    branches: [staging, develop]
  pull_request:
    branches: [staging]

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # 1. SONARQUBE — Analyse statique du code (avant les tests)
  # ═══════════════════════════════════════════════════════════════════════
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ═══════════════════════════════════════════════════════════════════════
  # 2. TESTS UNITAIRES — Backend + Frontend (après SonarQube)
  # ═══════════════════════════════════════════════════════════════════════
  test-backend:
    name: Test Backend
    needs: sonarqube
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install uv
        uses: astral-sh/setup-uv@caf3dbe0d021c439ed416147850241786c1aecd86 # v3.2.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras 2>/dev/null || uv sync --all-extras --no-lock

      - name: Run linter
        run: uv run ruff check .

      - name: Run type checker
        run: uv run mypy app

      - name: Run tests with coverage
        run: uv run pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@65462800fd43ddfe01e0345e6ee3f6b23170185a # v4.3.3
        with:
          name: backend-coverage
          path: backend/coverage.xml

  test-frontend:
    name: Test Frontend
    needs: sonarqube
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front_web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.3
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: ./front_web/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn type-check

      - name: Run tests with coverage
        run: yarn test --coverage --coverageReporters=lcov --coverageDirectory=coverage
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@65462800fd43ddfe01e0345e6ee3f6b23170185a # v4.3.3
        with:
          name: frontend-coverage
          path: front_web/coverage/lcov.info

  # ═══════════════════════════════════════════════════════════════════════
  # 3. BUILD — Frontend (après les tests)
  # ═══════════════════════════════════════════════════════════════════════
  build-frontend:
    name: Build Frontend
    needs: test-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front_web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.3
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: ./front_web/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build
